<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Link QR Code Generator</title>
    
    <link rel="icon" type="image/png" href="https://lamkh1219.github.io/qr_code_generator/images/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="https://lamkh1219.github.io/qr_code_generator/images/favicon/favicon.svg" />
    <link rel="shortcut icon" href="https://lamkh1219.github.io/qr_code_generator/images/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://lamkh1219.github.io/qr_code_generator/images/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="QR Gen" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="https://lamkh1219.github.io/qr_code_generator/images/favicon/site.webmanifest" />

    <script src="./qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #007bff;
            --accent-color: #28a745;
            --background-light: #f7f9fc;
            --background-paper: #ffffff;
            --text-dark: #333;
            --text-muted: #888;
            --border-light: #ddd;
            --shadow-subtle: 0 4px 12px rgba(0, 0, 0, 0.08);
        }
        
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            min-height: 100vh; 
            background-color: var(--background-light); 
            margin: 0; 
            padding: 50px 20px; 
            color: var(--text-dark);
        }

        .container { 
            background: var(--background-paper); 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: var(--shadow-subtle); 
            text-align: center; 
            width: 100%;
            max-width: 650px; 
        }

        h1 { 
            color: var(--primary-color); 
            margin-bottom: 30px; 
            font-weight: 500;
        }
        
        p {
            color: var(--text-muted);
            margin-bottom: 15px;
        }
        
        #urlInput, #qrSize, #languageSelect, #borderWidth {
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 12px;
            transition: border-color 0.3s, box-shadow 0.3s;
            box-sizing: border-box;
            font-size: 14px;
        }

        #urlInput { 
            width: 100%; 
            height: 150px; 
            margin: 10px 0 20px 0; 
            resize: vertical;
        }
        #urlInput:focus { 
            border-color: var(--primary-color); 
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1); 
            outline: none; 
        }

        .setting-row { 
            text-align: left; 
            margin-bottom: 20px; 
            display: flex;
            align-items: center;
            justify-content: space-between; 
            font-weight: 500;
        }
        
        #qrSize {
            width: 50%;
            cursor: pointer;
            padding: 8px;
        }

        #borderWidth {
            width: 80px;
            padding: 8px;
            margin-left: 10px;
        }
        
        #languageSelect {
             padding: 8px 12px;
             cursor: pointer;
        }

        #qrColor {
            -webkit-appearance: none;
            appearance: none;
            height: 40px; 
            border: 1px solid var(--border-light);
            border-radius: 8px;
            cursor: pointer;
            padding: 2px;
            background-color: transparent;
        }

        #qrColor::-webkit-color-swatch-wrapper { padding: 0; }
        #qrColor::-webkit-color-swatch { border: none; border-radius: 6px; }
        
        #applyColorBtn {
            padding: 8px 12px;
            background-color: var(--primary-color); 
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        #applyColorBtn:hover {
            background-color: #0056b3; 
        }

        #downloadBtn { 
            width: 100%;
            padding: 15px 20px; 
            background-color: var(--accent-color); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 17px; 
            font-weight: 500;
            margin-top: 20px; 
            display: none; 
            transition: background-color 0.3s, transform 0.1s; 
        }
        #downloadBtn:hover { background-color: #1e8736; }
        #downloadBtn:active { transform: scale(0.99); }
        #downloadBtn:disabled { cursor: not-allowed; opacity: 0.6; }

        #qrcodeContainer { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 25px; 
            margin-top: 30px; 
            padding: 20px; 
            border: 1px dashed var(--border-light); 
            border-radius: 8px;
            min-height: 120px; 
            align-items: center; 
        }
        .placeholder { 
            color: var(--text-muted);
            font-style: italic;
        }
        .qrcode-item { 
            text-align: center; 
            max-width: 150px; 
        }
        .qrcode-label {
            font-size: 11px; 
            color: var(--text-dark);
            font-weight: 400;
            margin-top: 8px;
        }
        
        #loading { 
            margin-top: 15px; 
            color: var(--primary-color); 
            font-weight: 500;
            display: none; 
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div style="text-align: right; margin-bottom: 20px;">
            <select id="languageSelect">
                <option value="en">English</option>
                <option value="zh-TW">繁體中文</option>
            </select>
        </div>

        <h1 id="appTitle">Multi-Link QR Code Generator</h1>
        <p id="instructionText">Please enter the URLs below, one per line (separated by Enter):</p>
        
        <textarea id="urlInput" placeholder="e.g.:&#10;https://www.google.com&#10;https://www.bing.com"></textarea>
        
        <div class="setting-row">
            <label id="sizeLabel" for="qrSize">QR Code Size (Pixels):</label>
            <select id="qrSize">
                <option value="100" id="size100">Small (100x100)</option>
                <option value="150" selected id="size150">Medium (150x150)</option>
                <option value="250" id="size250">Large (250x250)</option>
                <option value="400" id="size400">Extra Large (400x400)</option>
            </select>
        </div>
        
        <div class="setting-row">
            <label id="colorLabel" for="qrColor">QR Code Color:</label>
            <div style="display: flex; gap: 10px; width: 50%;">
                <input type="color" id="qrColor" value="#000000" style="flex-grow: 1;">
                <button id="applyColorBtn" type="button"><span id="applyColorBtnText">🎨 Apply</span></button>
            </div>
        </div>

        <div class="setting-row">
            <label id="borderLabel" for="addBorder">Add Border (Padding):</label>
            <div class="checkbox-container" style="width: 50%; justify-content: flex-end;">
                <input type="checkbox" id="addBorder" checked>
                <input type="number" id="borderWidth" value="20" min="0" max="200">
                <span style="font-size: 14px;">px</span>
            </div>
        </div>

        <div id="qrcodeContainer">
            <p class="placeholder" id="placeholderText">Please enter URLs above</p>
        </div>

        <div id="loading"><span id="loadingText">Generating and packing ZIP file, please wait...</span></div>

        <button id="downloadBtn"><span id="downloadBtnText">📥 Download All QR Codes (ZIP File)</span></button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlInput = document.getElementById('urlInput');
            const qrSizeSelect = document.getElementById('qrSize');
            const qrColorInput = document.getElementById('qrColor'); 
            const applyColorBtn = document.getElementById('applyColorBtn');
            const addBorderCheckbox = document.getElementById('addBorder');
            const borderWidthInput = document.getElementById('borderWidth');
            const qrcodeContainer = document.getElementById('qrcodeContainer');
            const downloadBtn = document.getElementById('downloadBtn');
            const loadingDiv = document.getElementById('loading');
            const languageSelect = document.getElementById('languageSelect');
            
            let generatedCodes = []; 
            let generateTimeout; 
            
            const translations = {
                'en': {
                    appTitle: 'Multi-Link QR Code Generator',
                    instructionText: 'Please enter the URLs below, one per line (separated by Enter):',
                    sizeLabel: 'QR Code Size (Pixels):',
                    colorLabel: 'QR Code Color:',
                    borderLabel: 'Add Border (Padding):',
                    applyColorBtnText: '🎨 Apply',
                    placeholderText: 'Please enter URLs above',
                    loadingText: 'Generating and packing ZIP file, please wait...',
                    downloadBtnTextMulti: '📥 Download All {count} QR Codes (ZIP)',
                    downloadBtnTextSingle: '📥 Download QR Code', 
                    size100: 'Small (100x100)',
                    size150: 'Medium (150x150)',
                    size250: 'Large (250x250)',
                    size400: 'Extra Large (400x400)',
                    alertEmpty: 'Please generate QR Code first!',
                    alertZipFail: 'ZIP packing failed, please check the browser console!',
                },
                'zh-TW': {
                    appTitle: '多連結 QR Code 生成器',
                    instructionText: '請在下方輸入網址連結，每行一個 (以 Enter 相隔)：',
                    sizeLabel: 'QR Code 尺寸 (像素)：',
                    colorLabel: 'QR Code 顏色：',
                    borderLabel: '加入外框 (留白)：',
                    applyColorBtnText: '🎨 確定',
                    placeholderText: '請在上方輸入網址',
                    loadingText: '正在生成並打包 ZIP 檔案，請稍候...',
                    downloadBtnTextMulti: '📥 下載所有 {count} 個 QR Code (ZIP)',
                    downloadBtnTextSingle: '📥 下載 QR Code',
                    size100: '小 (100x100)',
                    size150: '中 (150x150)',
                    size250: '大 (250x250)',
                    size400: '特大 (400x400)',
                    alertEmpty: '請先生成 QR Code！',
                    alertZipFail: 'ZIP 打包失敗，請檢查瀏覽器控制台！',
                }
            };

            function updateLanguage(langCode) {
                const lang = translations[langCode];
                if (!lang) return;

                document.getElementById('appTitle').textContent = lang.appTitle;
                document.getElementById('instructionText').textContent = lang.instructionText;
                document.getElementById('sizeLabel').textContent = lang.sizeLabel;
                document.getElementById('colorLabel').textContent = lang.colorLabel;
                document.getElementById('borderLabel').textContent = lang.borderLabel;
                document.getElementById('applyColorBtnText').textContent = lang.applyColorBtnText;
                
                document.getElementById('size100').textContent = lang.size100;
                document.getElementById('size150').textContent = lang.size150;
                document.getElementById('size250').textContent = lang.size250;
                document.getElementById('size400').textContent = lang.size400;

                generateQRCodes(); 
            }
            
            function debounce(func, delay) {
                return function() {
                    const context = this;
                    const args = arguments;
                    clearTimeout(generateTimeout);
                    generateTimeout = setTimeout(() => func.apply(context, args), delay);
                };
            }

            function getCleanFilename(url) {
                let clean = url.replace(/^(http|https):\/\//, '').replace(/\/.*/, '');
                return clean.replace(/[^a-zA-Z0-9-]/g, '_').substring(0, 50);
            }

            function createSingleQRCode(url, finalSize, finalColor) {
                const displaySize = 100; 
                const itemDiv = document.createElement('div');
                itemDiv.className = 'qrcode-item';
                
                const qrDiv = document.createElement('div'); 
                itemDiv.appendChild(qrDiv);

                // 畫面顯示用 (固定小尺寸)
                new QRCode(qrDiv, {
                    text: url,         
                    width: displaySize,        
                    height: displaySize,       
                    colorDark : finalColor, 
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });

                const label = document.createElement('div');
                label.className = 'qrcode-label';
                label.textContent = getCleanFilename(url);
                itemDiv.appendChild(label);
                qrcodeContainer.appendChild(itemDiv);

                // 下載用 (處理外框邏輯)
                setTimeout(() => {
                    const tempDiv = document.createElement('div');
                    new QRCode(tempDiv, {
                        text: url,         
                        width: finalSize,        
                        height: finalSize,       
                        colorDark : finalColor, 
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                    });

                    setTimeout(() => {
                        const qrCanvas = tempDiv.querySelector('canvas');
                        if (qrCanvas) {
                            let outputCanvas = qrCanvas;

                            // 如果勾選了「加入外框」
                            if (addBorderCheckbox.checked) {
                                const padding = parseInt(borderWidthInput.value) || 0;
                                const newSize = finalSize + (padding * 2);
                                
                                const borderCanvas = document.createElement('canvas');
                                borderCanvas.width = newSize;
                                borderCanvas.height = newSize;
                                const ctx = borderCanvas.getContext('2d');

                                // 填滿背景色 (白色)
                                ctx.fillStyle = "#ffffff";
                                ctx.fillRect(0, 0, newSize, newSize);

                                // 將原本的 QR Code 畫在正中央
                                ctx.drawImage(qrCanvas, padding, padding);
                                outputCanvas = borderCanvas;
                            }

                            const dataURL_download = outputCanvas.toDataURL('image/png');
                            generatedCodes.push({
                                filename: `QRCode_${getCleanFilename(url)}_${finalSize}x${finalSize}.png`,
                                dataURL: dataURL_download
                            });
                        }
                    }, 100); 
                }, 50); 
            }

            function generateQRCodes() {
                const finalSize = parseInt(qrSizeSelect.value); 
                const finalColor = qrColorInput.value; 
                const currentLang = languageSelect.value;
                const lang = translations[currentLang];

                qrcodeContainer.innerHTML = ''; 
                downloadBtn.style.display = 'none';
                generatedCodes = [];
                
                const urls = urlInput.value.split('\n'); 
                const validUrls = urls.map(url => url.trim()).filter(url => url.length > 0);
                
                if (validUrls.length === 0) {
                    qrcodeContainer.innerHTML = `<p class="placeholder" id="placeholderText">${lang.placeholderText}</p>`;
                    return;
                }

                validUrls.forEach(url => {
                    createSingleQRCode(url, finalSize, finalColor); 
                });
                
                setTimeout(() => {
                    downloadBtn.style.display = 'block';
                    let buttonText = (validUrls.length > 1) 
                        ? lang.downloadBtnTextMulti.replace('{count}', validUrls.length)
                        : lang.downloadBtnTextSingle;
                    document.getElementById('downloadBtnText').textContent = buttonText;
                }, 500); // 稍微增加延遲以確保 Canvas 處理完成
            }

            async function downloadAllQRCodes() {
                const currentLang = languageSelect.value;
                const lang = translations[currentLang];
                
                if (generatedCodes.length === 0) {
                    alert(lang.alertEmpty);
                    return;
                }

                if (generatedCodes.length === 1) {
                    const code = generatedCodes[0];
                    saveAs(code.dataURL, code.filename); 
                    return;
                }

                loadingDiv.style.display = 'block';
                downloadBtn.disabled = true;

                const zip = new JSZip();
                generatedCodes.forEach(code => {
                    const base64Data = code.dataURL.split(',')[1];
                    zip.file(code.filename, base64Data, {base64: true});
                });

                zip.generateAsync({type:"blob"})
                    .then(function(content) {
                        saveAs(content, "QR_Codes_Bundle.zip"); 
                        loadingDiv.style.display = 'none';
                        downloadBtn.disabled = false;
                    })
                    .catch(e => {
                        alert(lang.alertZipFail);
                        loadingDiv.style.display = 'none';
                        downloadBtn.disabled = false;
                    });
            }

            const debouncedGenerate = debounce(generateQRCodes, 300); 
            
            urlInput.addEventListener('input', debouncedGenerate);
            qrSizeSelect.addEventListener('change', generateQRCodes); 
            applyColorBtn.addEventListener('click', generateQRCodes); 
            addBorderCheckbox.addEventListener('change', generateQRCodes);
            borderWidthInput.addEventListener('input', debouncedGenerate);
            
            languageSelect.addEventListener('change', function() {
                updateLanguage(this.value);
            });
            
            downloadBtn.addEventListener('click', downloadAllQRCodes);

            languageSelect.value = 'en'; 
            updateLanguage('en'); 
        });
    </script>
</body>
</html>
